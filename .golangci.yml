# golangci-lint configuration used for CI
version: "2"

run:
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    - misspell
    - unused
    - staticcheck
    - gosec
    - govet

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vmware/antrea-operator-for-kubernetes

issues:
  exclude-files:
    - ".*\\.pb\\.go"
  exclude-dirs-use-default: true
