name: Go

on:
  pull_request:
    branches:
      - main

jobs:
  bin:
    name: Build binary and run unit tests
    runs-on: [ubuntu-latest]
    steps:
      - name: Check-out code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Build antrea-operator binary
        run: make bin
      - name: Run tests
        run: make test

  check-tidy:
    name: Check tidy
    runs-on: [ubuntu-latest]
    steps:
      - name: Check-out code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Check tidy
        run: make test-tidy
