name: Go

on:
  pull_request:
    branches:
      - main

jobs:
  bin:
    name: Build binary and run unit tests
    runs-on: [ubuntu-latest]
    steps:
      - name: Setup Go
        id: go-setup
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
      - name: Check-out code
        uses: actions/checkout@v4
      - name: Build antrea-operator binary
        run: make bin
      - name: Run tests
        run: make test

  check-tidy:
    name: Check tidy
    runs-on: [ubuntu-latest]
    steps:
      - name: Setup Go
        id: go-setup
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
      - name: Check-out code
        uses: actions/checkout@v4
      - name: Check tidy
        run: make test-tidy
